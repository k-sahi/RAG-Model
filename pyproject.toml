[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-rag"
version = "1.0.0"
description = "Hybrid retrieval-augmented question answering over a SaaS support knowledge base"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
  "pdf2image>=1.17",
  "pytesseract>=0.3.10",
]

[project.scripts]
helix-rag = "helix_rag.__main__:main"

[tool.setuptools.packages.find]
include = ["helix_rag*", "evals*"]
